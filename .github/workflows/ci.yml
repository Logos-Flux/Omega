name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/chat-api
          - apps/chat-frontend
          - apps/controller
          - apps/pi-harness
          - apps/rag-api/api
          - apps/rag-api/ingest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # -b is required: chat-frontend uses a solution-style tsconfig
      # (references + empty files), which plain `tsc --noEmit` silently
      # skips — it reported green while the app had type errors.
      - run: bun tsc -b --noEmit
        working-directory: ${{ matrix.app }}

  test:
    name: test
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
